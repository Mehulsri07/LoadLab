services:
  nginx:
    image: nginx:latest
    container_name: loadlab-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: loadlab-backend
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=production

  prometheus:
    image: prom/prometheus
    container_name: loadlab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/"

  grafana:
    image: grafana/grafana-oss
    container_name: loadlab-grafana
    ports:
      - "3003:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_DOMAIN=43.204.103.85
      - GF_SERVER_ROOT_URL=http://43.204.103.85/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ENABLE_GZIP=true
    volumes:
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter
    container_name: loadlab-node-exporter
    ports:
      - "9100:9100"

volumes:
  grafana-data:
